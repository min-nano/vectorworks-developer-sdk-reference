name: Lint

# PR と main への push で、このリポジトリが持つ実行物（調査ワークフローとその
# スクリプト）を検査する。ドキュメント（Markdown）の内容そのものは人（と実機確認）が
# 見るのでここでは検査しない。
#
#   * shellcheck    — scripts/ と plugin/scripts/ のシェルスクリプト。
#   * actionlint    — GitHub ワークフロー定義そのもの＋インライン run: スクリプト。
#   * clang-format  — 実機確認プラグイン（plugin/）と実機プローブ（probes/）の C++。
#                     整形の唯一の真実は .clang-format で、手で例外を作らない。
#   * unit-tests    — 殻の純粋な部分（自動アップデートの判断＝plugin/src/UpdateParse.h、
#                     本体のパスの組み立て＝plugin/src/PayloadHost.h、本体が殻から受け取った
#                     ものを写しているか＝plugin/src/PayloadHostHolder.h）。SDK にも
#                     プラットフォームにも依存しないので普通のコンパイラで走る。**壊れても
#                     静かに壊れる**（更新が来ない／常に来る／再起動が空振りする／実機でだけ
#                     落ちる）ので、mac / Windows の実ビルドとは別に、ここで確かめる。
#
# 完了待ちは `scripts/ci-wait.sh --pr <番号>` で行う（CLAUDE.md「CI の完了を待つ」）。
# plugin/ を触った PR ではこれに加えて probe-build.yml（mac / Windows の実ビルド）が、
# probes/runtime/ を触った PR では probe-auto-update.yml（main のビルドを起動して
# 完了まで待ち、リリースを更新する）が走る。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "v1.7.12"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run shellcheck
        run: |
          set -euo pipefail
          shellcheck --version
          shellcheck scripts/*.sh plugin/scripts/*.sh

  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版を固定する。clang-format は版が変わると整形結果も変わるので、「手元で
      # かけたのに CI が落ちる」を避けるにはバージョンを 1 つに決めるしかない
      # （18 は実プラグイン側が .clang-format を合わせた版）。
      - name: Install clang-format 18
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          clang-format-18 --version

      - name: Check formatting
        run: |
          set -euo pipefail
          files="$(find plugin/src plugin/tests probes -type f \( -name '*.cpp' -o -name '*.h' \) | sort)"
          if [ -z "$files" ]; then
            echo "整形対象の C++ がありません。"
            exit 0
          fi
          echo "$files"
          # shellcheck disable=SC2086  # 改行区切りの一覧をそのまま引数へ展開する
          clang-format-18 --dry-run --Werror $files

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CMake も SDK も要らない（テスト対象はヘッダ 1 つ＋標準ライブラリだけ）。
      - name: Build and run the SDK-free unit tests
        run: |
          set -euo pipefail
          g++ --version | head -n 1
          g++ -std=c++20 -Wall -Wextra -Werror -I plugin/src \
            plugin/tests/UpdateParseTests.cpp -o /tmp/update-parse-tests
          /tmp/update-parse-tests
          g++ -std=c++20 -Wall -Wextra -Werror -I plugin/src \
            plugin/tests/PayloadPathTests.cpp -o /tmp/payload-path-tests
          /tmp/payload-path-tests
          g++ -std=c++20 -Wall -Wextra -Werror -I plugin/src \
            plugin/tests/PayloadHostHolderTests.cpp -o /tmp/payload-host-holder-tests
          /tmp/payload-host-holder-tests
          g++ -std=c++20 -Wall -Wextra -Werror -I plugin/src \
            plugin/tests/PayloadCatalogTests.cpp -o /tmp/payload-catalog-tests
          /tmp/payload-catalog-tests

      # カタログを**書く**側（CMake）の試験。SDK もコンパイラも要らない（純粋な文字列
      # 処理なので cmake -P でそのまま走る）。読む側（PayloadCatalogTests）と対で、
      # 「ビルドが書いた索引を殻が読める」を両側から押さえる。
      - name: Check the catalog generator
        run: cmake -P plugin/tests/probe-catalog-test.cmake

      # ビルド ID は**同じ入力なら同じ値**でなければならない（そうでないと、同じ顔ぶれで
      # 作り直すたびに「新しいビルドがあります」と誘ってしまう）。集約を 2 回走らせて
      # 突き合わせるだけで確かめられるので、ここで見張る。
      - name: Check that the build id is reproducible
        run: |
          set -euo pipefail
          scripts/gather-probes.sh --out /tmp/g1 >/dev/null
          scripts/gather-probes.sh --out /tmp/g2 >/dev/null
          a="$(cat /tmp/g1/build-id.txt)"
          b="$(cat /tmp/g2/build-id.txt)"
          echo "build id: $a"
          if [ "$a" != "$b" ]; then
            echo "::error::同じ入力なのにビルド ID が変わりました（$a != $b）。"
            diff /tmp/g1/build-id-source.txt /tmp/g2/build-id-source.txt || true
            exit 1
          fi
          if [ -z "$a" ]; then
            echo "::error::ビルド ID が空です。"
            exit 1
          fi

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Install actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: Run actionlint
        run: |
          set -euo pipefail
          shellcheck --version
          "$(go env GOPATH)/bin/actionlint" -color
