name: Lint

# PR と main への push で、このリポジトリが持つ実行物（調査ワークフローとその
# スクリプト）を検査する。ドキュメント（Markdown）の内容そのものは人（と実機確認）が
# 見るのでここでは検査しない。
#
#   * shellcheck  — scripts/ のシェルスクリプト。
#   * actionlint  — GitHub ワークフロー定義そのもの＋インライン run: スクリプト。
#
# これが PR の唯一の CI なので、リモートセッションからの完了待ちは
# `scripts/ci-wait.sh --pr <番号>` で行う（CLAUDE.md「CI の完了を待つ」）。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "v1.7.12"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run shellcheck
        run: |
          set -euo pipefail
          shellcheck --version
          shellcheck scripts/*.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Install actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: Run actionlint
        run: |
          set -euo pipefail
          shellcheck --version
          "$(go env GOPATH)/bin/actionlint" -color
