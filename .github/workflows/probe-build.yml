name: Probe plug-in

# ---------------------------------------------------------------------------
# 実機確認プラグイン（plugin/ — VwSdkProbes）をビルドし、GitHub Release として配る。
#
# なぜ必要か: Findings に**無印（＝実機確認済み）**で書ける知見は、ローカルの
# VectorWorks でしか取れない。その実機で動かす道具がこのプラグインで、中身は
# 「メニューコマンド 1 つ＋そこから選んで走らせるプローブ（PR ごとの調査コード）」。
#
# **本体（プローブ）は群ごとに 1 本**（main のプローブが 1 本、PR のプローブが PR ごとに
# 1 本）。ビルドは殻 → 本体を 1 本ずつの順に行い、**PR の群が落ちてもその群だけ外して
# 先へ進む**（scripts/build-payloads.sh。main の群が落ちたときだけ全体を失敗にする）。
# 落ちた群はリリースノートの表と、隠しメタデータ payloads= に出る。
#
# 3 つの入口があり、publish するのは push / workflow_dispatch だけ:
#
#   workflow_dispatch  main で叩く**主たる入口**。inputs.prs に PR 番号を並べると、
#                      その PR たちの probes/runtime/ を main のものと**同居**させて
#                      1 本のプラグインにする（マージ前に実機で確かめるため）。
#                      **probes/runtime/ を触った PR では、これを probe-auto-update.yml
#                      が自動で叩く**（プローブを置いたら公開まで自動で進む）。
#   push (main)        main のプローブだけでリリースを作り直す。
#   pull_request       **ビルドが通るかの確認だけ**（公開しない）。プラグイン本体
#                      （plugin/ とビルドの仕掛け）を触った PR で「ディスパッチしたら
#                      コンパイルエラーだった」を防ぐための門。**probes/runtime/ だけの
#                      PR はここでは走らない**——そちらは probe-auto-update.yml が
#                      main のビルドを起動し、その結果を PR のチェックにするので、
#                      同じものを二度ビルドすることになるため。
#
# 公開先は転がり続けるタグ 1 つ（probes）。リリースノートに「何が入っているか」の表を
# 必ず載せる——同居する顔ぶれは実行のたびに変わるので、そこだけが真実になる。
# ---------------------------------------------------------------------------

run-name: >-
  probe build (${{ inputs.prs && format('PR {0} + ', inputs.prs) || '' }}${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      prs:
        description: "同居させる PR 番号（カンマ区切り。空なら main のプローブだけ）"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      # plugin/README.md のような読み物だけの変更で mac / Windows の実ビルドを
      # 走らせないよう、ビルドに入るものだけを並べる。
      - "plugin/src/**"
      - "plugin/resources/**"
      - "plugin/CMakeLists.txt"
      - "probes/runtime/**"
      - "scripts/gather-probes.sh"
      - "scripts/fetch-vw-sdk.sh"
      - ".github/workflows/probe-build.yml"
  pull_request:
    paths:
      # plugin/README.md のような読み物だけの変更で mac / Windows の実ビルドを
      # 走らせないよう、ビルドに入るものだけを並べる。
      # **probes/runtime/ はここに無い。** プローブだけの PR は probe-auto-update.yml
      # が main のビルドを起動し、その結果を PR のチェックにするので、ここでも
      # 走らせると同じものを二度ビルドすることになる。
      - "plugin/src/**"
      - "plugin/resources/**"
      - "plugin/CMakeLists.txt"
      - "scripts/gather-probes.sh"
      - "scripts/fetch-vw-sdk.sh"
      - ".github/workflows/probe-build.yml"

permissions:
  contents: read

# 1 つの ref につき 1 本。PR では新しい push が走行中のビルドを止める（古いコミットの
# 確認用ビルドに意味は無い）。main / dispatch は止めない——それぞれが公開まで走り切る。
concurrency:
  group: probe-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -------------------------------------------------------------------------
  # 何を同居させるかを**1 か所で**決める。ここで作ったソース一式とマニフェストを
  # 両プラットフォームのビルドが同じものとして受け取るので、「mac と win で入っている
  # プローブが違う」が構造的に起こらない。
  gather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR では GITHUB_SHA が一時的なマージコミットなので head を見る（開発者が
          # push したコミット＝確認したいもの）。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Gather probes
        env:
          # PR タイトル・ブランチ名を引くのに使う（取れなくてもビルドは通る）。
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ inputs.prs }}
        run: scripts/gather-probes.sh --prs "$PRS"

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "ビルド ID: \`$(cat build-probes/build-id.txt)\`"
            echo "殻の ID: \`$(cat build-probes/shell-id.txt)\`"
            echo
            cat build-probes/summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gathered probes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-sources
          path: build-probes

  # -------------------------------------------------------------------------
  build-mac:
    needs: gather
    runs-on: macos-15

    env:
      VW_SDK_URL: https://release.vectorworks.net/latest/Vectorworks/2026-NNA-eng-mac-SDK.zip
      VW_SDK_DIR: ${{ github.workspace }}/vw-sdk-plugin
      # ヘッダだけの ci-debug 用キャッシュとは**別のキー**（中身が違う。Lib と Tools を含む）。
      VW_SDK_CACHE_KEY: vw-sdk-2026-NNA-mac-plugin-v1
      VW_SDK_PARTS: plugin
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VW_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_SHA }}

      # 実プラグイン（vectorworks-plugin-import-ifc-homeskz）が Vectorworks 2026 向けに
      # 使っているのと同じ Xcode に合わせる。
      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.2"

      - name: Cache Vectorworks SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VW_SDK_DIR }}
          key: ${{ env.VW_SDK_CACHE_KEY }}

      - name: Set up Vectorworks SDK
        run: scripts/fetch-vw-sdk.sh

      - name: Download gathered probes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: probe-sources
          path: build-probes

      - name: Configure
        # 短縮 sha の切り出しだけはシェル側（GitHub の式に部分文字列が無い）。
        run: |
          cmake -S plugin -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DVW_SDK_DIR="$VW_SDK_DIR" \
            -DVW_BUILD_VERSION="${BUILD_SHA:0:7}" \
            -DVW_BUILD_BRANCH="$VW_BUILD_BRANCH" \
            -DVW_PROBE_MANIFEST="$GITHUB_WORKSPACE/build-probes/manifest.cmake"

      # 殻は**必ず**通らなければならない（メニューもダイアログも更新もここに入っている）。
      - name: Build the shell
        run: cmake --build build --config Release --target VwSdkProbes --parallel "$(sysctl -n hw.ncpu)"

      # 本体は**群ごとに 1 本ずつ**。PR の群が 1 つ通らなくても、他の群は配る
      # （scripts/build-payloads.sh。main の群が通らないときだけ落とす）。
      - name: Build each payload
        run: |
          scripts/build-payloads.sh \
            --build build --groups build-probes/groups.txt \
            --status payload-status-mac.txt --parallel "$(sysctl -n hw.ncpu)"

      # Apple Silicon はすべての Mach-O に署名を要求する。証明書の要らない ad-hoc 署名
      # （"-"）で足りる（Developer ID 署名ではないので、VW の「不明なプラグイン」警告は出る）。
      # .vwr を固めた後に署名するので、リソースまで含めて封がかかる。
      - name: Ad-hoc code-sign the bundle and the payloads
        run: |
          set -euo pipefail
          # 本体（.vwpayload）はバンドルの**隣**に置いた Mach-O で、殻が自分で dlopen する。
          # バンドルとは別に署名する（Apple Silicon は署名の無い Mach-O を読み込まない）。
          # **中に入れないのは、差し替えるたびに殻の署名が壊れるから**（署名はリソースまで
          # 封をする。plugin/src/PayloadHost.h）。作れた群のぶんだけ回す。
          for payload in build/VwSdkProbesPayload-*.vwpayload; do
            [ -e "$payload" ] || continue
            codesign --force --sign - "$payload"
            codesign --verify --strict --verbose=2 "$payload"
          done
          codesign --force --deep --sign - build/VwSdkProbes.vwlibrary
          codesign --verify --strict --verbose=2 build/VwSdkProbes.vwlibrary

      - name: Inspect built plug-in
        run: |
          set -euo pipefail
          bundle="build/VwSdkProbes.vwlibrary"
          test -d "$bundle" || { echo "::error::$bundle が作られていません"; exit 1; }
          find "$bundle" -maxdepth 3
          lipo -info "$bundle/Contents/MacOS/VwSdkProbes"
          test -e "$bundle/Contents/Resources/VwSdkProbes.vwr" \
            || { echo "::error::VwSdkProbes.vwr がバンドルへ入っていません"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :VWBuildCommit" "$bundle/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :VWProbes"      "$bundle/Contents/Info.plist"
          # 自動アップデートが読む鍵。ここが空だと「常に最新」になって更新が止まる。
          /usr/libexec/PlistBuddy -c "Print :VWBuildId"     "$bundle/Contents/Info.plist"
          test -f "$bundle/Contents/Resources/vw-probes-update.sh" \
            || { echo "::error::vw-probes-update.sh がバンドルへ入っていません"; exit 1; }
          # 自動アップデートが「再起動が要るか」を決める鍵。空だと必ず再起動を求めてしまう。
          /usr/libexec/PlistBuddy -c "Print :VWShellId" "$bundle/Contents/Info.plist"
          # カタログ（殻が本体を読み込まずに一覧を出すための索引）。**これが無いと
          # ピッカーが空になる**ので、必ず作られていることを確かめる。
          test -f build/VwSdkProbes.probes.txt \
            || { echo "::error::カタログ (VwSdkProbes.probes.txt) が作られていません"; exit 1; }
          cat build/VwSdkProbes.probes.txt
          # 本体（プローブはこちらに入る）。バンドルの**隣**であることが肝。群ごとに 1 本。
          ls -l build/VwSdkProbesPayload-*.vwpayload
          for payload in build/VwSdkProbesPayload-*.vwpayload; do lipo -info "$payload"; done
          # main の群は必ず要る（PR の群は落ちていることがある）。
          test -f build/VwSdkProbesPayload-main.vwpayload \
            || { echo "::error::main の本体が作られていません"; exit 1; }

      # "<name>.vwlibrary/" の階層を保ったまま zip する（展開してそのまま使えるように）。
      # **zip は 1 つだけ。** 殻と本体を分けて配らないのは、展開の手間を増やさないため
      # ——本体だけの入れ替えも、この zip から本体のファイルだけを取り出して置けば済む
      # （plugin/scripts/vw-probes-update.sh の do-install-payload）。
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          # 作れた本体だけを入れる（落ちた群のぶんは無い＝配られない。カタログには
          # 残るので、殻が「※本体なし」と出す）。
          payloads=()
          for payload in build/VwSdkProbesPayload-*.vwpayload; do
            [ -e "$payload" ] || continue
            payloads+=("$(basename "$payload")")
          done
          ( cd build && zip -qry "$GITHUB_WORKSPACE/dist/VwSdkProbes.vwlibrary.zip" \
              VwSdkProbes.vwlibrary VwSdkProbes.probes.txt "${payloads[@]}" )
          # 群ごとのビルド結果はリリースノートと PR のチェックが読む。
          cp payload-status-mac.txt dist/
          ls -l dist

      # 公開用（リリース資産の zip ＋ 群ごとのビルド結果）。**release ジョブだけが使う。**
      - name: Upload the release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vwlibrary-zip
          path: dist

      # 人が手で入れる用。**中に zip を作らない**——GitHub の成果物はダウンロード時点で
      # 1 度 zip になるので、その中がさらに zip だと「展開したら zip が出てきて、もう
      # 一度展開して置き直す」ことになる。ここは素のファイルのまま上げて、展開したら
      # そのまま Plug-Ins へ置ける形にしておく。
      - name: Upload the plug-in files (for hand install)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VwSdkProbes-mac
          path: |
            build/VwSdkProbes.vwlibrary
            build/VwSdkProbes.probes.txt
            build/VwSdkProbesPayload-*.vwpayload

  # -------------------------------------------------------------------------
  build-windows:
    needs: gather
    runs-on: windows-latest

    env:
      VW_SDK_URL: https://release.vectorworks.net/latest/Vectorworks/2026-NNA-eng-win-SDK.zip
      VW_SDK_DIR: ${{ github.workspace }}/vw-sdk-plugin-win
      VW_SDK_CACHE_KEY: vw-sdk-2026-NNA-win-plugin-v1
      VW_SDK_PARTS: plugin
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VW_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_SHA }}

      - name: Cache Vectorworks SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VW_SDK_DIR }}
          key: ${{ env.VW_SDK_CACHE_KEY }}

      - name: Set up Vectorworks SDK
        shell: bash
        run: scripts/fetch-vw-sdk.sh

      - name: Download gathered probes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: probe-sources
          path: build-probes

      - name: Configure
        shell: bash
        run: |
          cmake -S plugin -B build -A x64 \
            -DVW_SDK_DIR="$VW_SDK_DIR" \
            -DVW_BUILD_VERSION="${BUILD_SHA:0:7}" \
            -DVW_BUILD_BRANCH="$VW_BUILD_BRANCH" \
            -DVW_PROBE_MANIFEST="$GITHUB_WORKSPACE/build-probes/manifest.cmake"

      # 殻は**必ず**通らなければならない。
      - name: Build the shell
        shell: bash
        run: cmake --build build --config Release --target VwSdkProbes --parallel "$(nproc)"

      # 本体は**群ごとに 1 本ずつ**（mac 側と同じ理由・同じスクリプト）。
      - name: Build each payload
        shell: bash
        run: |
          scripts/build-payloads.sh \
            --build build --groups build-probes/groups.txt \
            --status payload-status-win.txt --parallel "$(nproc)"

      - name: Inspect built plug-in
        shell: bash
        run: |
          set -euo pipefail
          d="build/Release"
          test -f "$d/VwSdkProbes.vlb" || { echo "::error::VwSdkProbes.vlb が作られていません"; exit 1; }
          test -f "$d/VwSdkProbes.vwr" || { echo "::error::VwSdkProbes.vwr が作られていません"; exit 1; }
          test -f "$d/vw-probes-update.ps1" \
            || { echo "::error::vw-probes-update.ps1 が置かれていません"; exit 1; }
          # カタログ（殻が本体を読み込まずに一覧を出すための索引）。
          test -f "$d/VwSdkProbes.probes.txt" \
            || { echo "::error::カタログ (VwSdkProbes.probes.txt) が作られていません"; exit 1; }
          # 本体（プローブはこちらに入る）。.vlb の隣に、群ごとに 1 本。
          ls -l "$d"/VwSdkProbesPayload-*.vwpayload
          test -f "$d/VwSdkProbesPayload-main.vwpayload" \
            || { echo "::error::main の本体が作られていません"; exit 1; }
          cat "$d/VwSdkProbes.build-info.txt"
          cat "$d/VwSdkProbes.probes.txt"

      - name: Package module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          # **zip は 1 つだけ**（殻＋本体）。本体だけの入れ替えも、この zip から本体の
          # ファイルだけを取り出して置く（vw-probes-update.ps1 の do-install-payload）。
          # 作れた本体だけを入れる（落ちた群のぶんは無い＝配られない。カタログには
          # 残るので、殻が「※本体なし」と出す）。
          $files = @(
            'build/Release/VwSdkProbes.vlb',
            'build/Release/VwSdkProbes.vwr',
            'build/Release/VwSdkProbes.build-info.txt',
            'build/Release/VwSdkProbes.probes.txt',
            'build/Release/vw-probes-update.ps1'
          ) + (Get-ChildItem 'build/Release' -Filter 'VwSdkProbesPayload-*.vwpayload' |
                 ForEach-Object { $_.FullName })
          $files = $files | Where-Object { Test-Path $_ }
          Compress-Archive -Path $files -DestinationPath 'dist/VwSdkProbes.vlb.zip' -Force
          # 群ごとのビルド結果はリリースノートと PR のチェックが読む。
          Copy-Item 'payload-status-win.txt' 'dist/'
          Get-ChildItem dist | Select-Object Name, Length

      # 公開用（リリース資産の zip ＋ 群ごとのビルド結果）。**release ジョブだけが使う。**
      - name: Upload the release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vlb-zip
          path: dist

      # 人が手で入れる用（mac 側と同じ理由で、中に zip を作らない）。
      - name: Upload the plug-in files (for hand install)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VwSdkProbes-windows
          path: |
            build/Release/VwSdkProbes.vlb
            build/Release/VwSdkProbes.vwr
            build/Release/VwSdkProbes.build-info.txt
            build/Release/VwSdkProbes.probes.txt
            build/Release/vw-probes-update.ps1
            build/Release/VwSdkProbesPayload-*.vwpayload

  # -------------------------------------------------------------------------
  # 転がり続けるリリース（タグ probes）を作り直す。PR では公開しない
  # （PR の役目はコンパイルが通ることの確認だけ）。
  release:
    needs: [gather, build-mac, build-windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      BUILD_SHA: ${{ github.sha }}
      PRS: ${{ inputs.prs }}

    steps:
      # 本文を組むスクリプト（scripts/probe-release-notes.sh）を使うので、ここでも
      # チェックアウトが要る（成果物だけでは足りない）。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download gathered probes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: probe-sources
          path: build-probes

      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vwlibrary-zip
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vlb-zip
          path: dist

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${BUILD_SHA:0:7}"
          title="Probes (${short})"
          if [ -n "$PRS" ]; then
            title="Probes (${short} + PR ${PRS})"
          fi
          # 本文（隠しメタデータ＋人が読む表）は scripts/probe-release-notes.sh が組む。
          # **機械が読む行がここに入る**ので、ワークフローへ埋め込まずスクリプトにして
          # ある（shellcheck も掛かるし、手元で確かめられる）。
          scripts/probe-release-notes.sh --commit "$BUILD_SHA" > notes.md
          cat notes.md
          # 転がりタグなので、毎回消して作り直す（常にこのビルドを指すように）。
          gh release delete probes --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create probes \
            "dist/VwSdkProbes.vwlibrary.zip" \
            "dist/VwSdkProbes.vlb.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$BUILD_SHA" \
            --title "$title" \
            --notes-file notes.md \
            --prerelease
